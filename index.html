<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>CX 프차 대시보드</title>
  <style>
    html,body{margin:0;height:100%;background:#f6f4ec;font-family:Arial,"Noto Sans KR",sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f6f4ec}
    .open{position:fixed;right:14px;bottom:14px;z-index:2;background:#171717;color:#ffd400;text-decoration:none;font-size:12px;font-weight:800;padding:8px 12px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:.85}
    .open:hover{opacity:1}
    @media print{.open{display:none}}
  </style>
</head>
<body>
  <!-- CX 프차 대시보드(내부용) 껍데기. 데이터 없음. 회사 계정으로 로그인한 사람만 내용이 보입니다. -->
  <iframe id="app" title="CX 프차 대시보드" allow="clipboard-write"></iframe>
  <a class="open" id="open" target="_blank" rel="noopener">새 창으로 열기 ↗</a>
  <script>
    var APP_URL = "https://script.google.com/a/macros/ishopcare.co.kr/s/AKfycbxlzakMMqF9rXeDObXBJP5JvFo-KzCv0TukZuvUWVaVHdZv9vqFvdSkWrXeXFjsn5Hbcg/exec";
    var page = new URLSearchParams(location.search).get("page");
    var src = APP_URL + (page && /^[a-z0-9-]{1,40}$/.test(page) ? "?page=" + encodeURIComponent(page) : "");
    document.getElementById("app").src = src;
    document.getElementById("open").href = src;
  </script>
</body>
</html>
